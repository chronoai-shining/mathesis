name: Project showcase

on:
  pull_request:
    paths:
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Configure showcase address
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const domain = (process.env.CUSTOM_DOMAIN || '').trim();
          if (domain && (domain.length > 253 || !/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i.test(domain))) {
            throw new Error('PAGES_CUSTOM_DOMAIN must be a hostname without a scheme or path.');
          }
          const repository = process.env.GITHUB_REPOSITORY.split('/')[1];
          const base = domain || repository.endsWith('.github.io') ? '/' : `/${repository}/`;
          appendFileSync(process.env.GITHUB_ENV, `PAGES_BASE_PATH=${base}\nPAGES_DOMAIN=${domain}\n`);
          NODE
      - name: Build static showcase
        run: npm run build:showcase
        working-directory: web
        env:
          VITE_MATHESIS_APP_URL: ${{ vars.MATHESIS_APP_URL }}
      - name: Add custom domain when configured
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          if (process.env.PAGES_DOMAIN) writeFileSync('web/dist-showcase/CNAME', `${process.env.PAGES_DOMAIN}\n`);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-showcase

  deploy:
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || github.ref_name == 'main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
